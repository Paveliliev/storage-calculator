<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Storage Zone Optimizer Pro</title>
    
    <link rel="stylesheet" href="styles.css" />
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <script src="script.js" defer></script>
</head>
<body id="body" class="dark-mode">

    <div class="top-nav">
        <button class="nav-btn" onclick="document.getElementById('settings-modal').style.display='block'">⚙️ Settings</button>
        <button id="theme-toggle" class="nav-btn" onclick="handleThemeClick()">🌓 Mode</button>
    </div>

    <div id="settings-modal" class="settings-overlay" onclick="saveAndClose()">
        <div class="settings-menu" onclick="event.stopPropagation()">
            <button onclick="saveAndClose()" style="width:100%; padding:12px; background:#28a745; color:white; border-radius:5px; margin-bottom:15px;">✅ Save & Close</button>
            
            <h3>Target Buffer Zones (%)</h3>
            <div class="grid-2" style="margin-bottom:15px;">
                <div><label class="input-label">Each Buffer %</label><input type="number" id="BUF_E" value="80"></div>
                <div><label class="input-label">Carton Buffer %</label><input type="number" id="BUF_C" value="100"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 15px;">
            <h3>Zone & Pallet Limits</h3>
            <div style="margin-bottom:10px;"><label>SH (Shelving)</label><div class="grid-3"><input type="number" id="SH_L" value="55"><input type="number" id="SH_W" value="32"><input type="number" id="SH_H" value="30"></div></div>
            <div style="margin-bottom:10px;"><label>OC (Conveyor)</label><div class="grid-3"><input type="number" id="OC_L" value="51.5"><input type="number" id="OC_W" value="33.5"><input type="number" id="OC_H" value="34"></div></div>
            <div style="margin-bottom:10px;"><label>CL (Carton Live)</label><div class="grid-3"><input type="number" id="CL_L" value="238"><input type="number" id="CL_W" value="41.5"><input type="number" id="CL_H" value="36"></div></div>
            <div style="margin-bottom:10px;"><label>UK4W (4-Way Pallet - 1.8m)</label><div class="grid-3"><input type="number" id="UK4W_L" value="120"><input type="number" id="UK4W_W" value="100"><input type="number" id="UK4W_H" value="167"></div></div>
            <div style="margin-bottom:20px;"><label>EURO (Euro Pallet - 1.8m)</label><div class="grid-3"><input type="number" id="EURO_L" value="120"><input type="number" id="EURO_W" value="80"><input type="number" id="EURO_H" value="167"></div></div>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 15px;">
            <button onclick="resetToFactory()" style="width:100%; padding:10px; background:#dc3545; color:white; border-radius:5px;">⚠️ Reset Factory</button>
        </div>
    </div>

    <div class="card">
        <h1>Storage Optimizer</h1>
        <div>
            <label class="input-label">Each (L/W/H/kg):</label>
            <div class="grid-3"><input type="number" id="L" placeholder="L"><input type="number" id="W" placeholder="W"><input type="number" id="H" placeholder="H"></div>
            <input type="number" id="Weight" placeholder="Each kg" style="margin-top:8px;">
        </div>

        <div style="background: var(--secondary-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 15px;">
            <label class="input-label">Carton (L/W/H/kg/Qty):</label>
            <div class="grid-3"><input type="number" id="CL_c" placeholder="CL"><input type="number" id="CW" placeholder="CW"><input type="number" id="CH" placeholder="CH"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                <input type="number" id="CWE" placeholder="Box kg"><input type="number" id="CQ" placeholder="Items/Box">
            </div>
        </div>

        <div class="btn-row">
            <button id="reset-btn" py-click="reset_inputs">Reset</button>
            <button id="calc-btn" py-click="calc">Analyze Fit</button>
        </div>
        <div id="output-area"></div>
        <button id="copy-btn" onclick="copyResults()">📋 Copy Results</button>
    </div>

    <script type="py" src="logic.txt" config="pyscript.json"></script>
</body>
</html>
